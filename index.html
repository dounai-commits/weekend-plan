<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --canvas: #F5F5F7;
  --primary: #1D1D1F;
  --primary-active: #000000;
  --ink: #1D1D1F;
  --body: #1D1D1F;
  --muted: #86868B;
  --muted-soft: #86868B;
  --hairline: #D2D2D7;
  --hairline-soft: #E8E8ED;
  --surface-soft: #F5F5F7;
  --surface-card: #FFFFFF;
  --surface-dark: #1D1D1F;
  --on-dark: #F5F5F7;
  --on-dark-soft: #86868B;
  --success: #34C759;
  --accent-teal: #34C759;
  --font-heading: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  --radius-btn: 6px;
  --radius-card: 6px;
  --radius-container: 6px;
  --radius-pill: 9999px;
}

body {
  font-family: var(--font-body);
  background: var(--canvas);
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
  touch-action: pan-y;
  overscroll-behavior: none;
}

/* Prevent iOS double-tap zoom */
* {
  touch-action: manipulation;
}

/* Onboarding */
#onboarding-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--canvas);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.onboarding-card {
  width: 100%;
  max-width: 320px;
  text-align: center;
}
.onboarding-emoji {
  font-size: 56px;
  margin-bottom: 24px;
}
.onboarding-title {
  font-family: var(--font-heading);
  font-size: 26px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.8px;
  margin-bottom: 8px;
}
.onboarding-subtitle {
  font-size: 15px;
  color: var(--muted);
  margin-bottom: 32px;
}
.onboarding-input {
  width: 100%;
  font-size: 18px;
  font-weight: 500;
  text-align: center;
  padding: 16px;
  border: 1.5px solid var(--hairline);
  border-radius: var(--radius-card);
  background: var(--surface-card);
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
  font-family: var(--font-body);
}
.onboarding-input:focus {
  border-color: var(--primary);
}
.onboarding-hint {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
  margin-bottom: 24px;
}
.onboarding-btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: var(--radius-pill);
  background: var(--surface-dark);
  color: var(--on-dark);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.onboarding-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.onboarding-btn:not(:disabled):active {
  opacity: 0.8;
}

.phone-frame {
  width: 100%;
  max-width: 430px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  background: var(--canvas);
  overflow: hidden;
  position: relative;
  touch-action: pan-y;
}

.app-container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--canvas);
  position: relative;
}

.tab-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 64px;
  scrollbar-width: none;
}
.tab-content::-webkit-scrollbar { display: none; }

.tab-panel { display: none; padding: 0 24px; padding-top: 48px; }
.tab-panel.active { display: block; }

/* Bottom Tab Bar */
.tab-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 64px;
  background: var(--canvas);
  border-top: 0.5px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding-bottom: env(safe-area-inset-bottom, 0);
  z-index: 50;
}

.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 8px 16px;
  transition: all 0.2s;
}

.tab-item span {
  font-size: 10px;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: 0.2px;
}

.tab-item i { color: var(--muted); width: 22px; height: 22px; }

.tab-item.active i { color: var(--primary); }
.tab-item.active span { color: var(--primary); font-weight: 600; }

/* ===== TAB 1: Weekend ===== */
.greeting {
  font-family: var(--font-heading);
  font-size: 32px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -1px;
  margin-bottom: 8px;
  line-height: 1.2;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-btn);
  border: none;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}
.icon-btn:hover { background: var(--hairline-soft); }
.icon-btn i { color: var(--body); width: 20px; height: 20px; }

.countdown {
  font-size: 15px;
  color: var(--muted);
  margin-bottom: 56px;
  font-weight: 400;
  letter-spacing: -0.2px;
}

.countdown strong {
  color: var(--primary);
  font-weight: 600;
}

/* Weather Card */
.weather-card {
  background: transparent;
  border-radius: 0;
  padding: 0 0 16px 0;
  margin-bottom: 24px;
  display: flex;
  gap: 0;
  border-bottom: 0.5px solid var(--hairline);
}

.weather-day {
  flex: 1;
  text-align: center;
}

.weather-day .day-label {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 4px;
  font-weight: 500;
}

.weather-day .day-date {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 10px;
}

.weather-day .weather-icon {
  margin-bottom: 8px;
}
.weather-day .weather-icon i { color: var(--primary); width: 24px; height: 24px; }

.weather-day .temp {
  font-family: var(--font-heading);
  font-size: 26px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -1px;
}

.weather-day .desc {
  display: none;
}

.weather-divider {
  width: 0.5px;
  background: var(--hairline);
  margin: 8px 0;
}

/* Section Header Row */
.section-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

/* Inspiration Overlay */
#inspiration-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 32px;
}
#inspiration-overlay.visible {
  display: flex;
}
.inspiration-card {
  background: var(--surface-card);
  border-radius: 16px;
  padding: 28px 24px;
  width: 100%;
  max-width: 320px;
  animation: cardPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes cardPop {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.inspiration-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.inspiration-close {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0.4;
  transition: opacity 0.2s;
}
.inspiration-close:active { opacity: 0.8; }
.inspiration-close i { width: 14px; height: 14px; }
.inspiration-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: #F27149;
  background: #FFF3EE;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
}
.inspiration-badge i { width: 12px; height: 12px; }
.inspiration-body {
  margin-bottom: 16px;
}
.inspiration-title {
  font-family: var(--font-heading);
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
  line-height: 1.3;
}
.inspiration-reason {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
}
.inspiration-actions {
  display: flex;
  gap: 10px;
}
.inspiration-btn {
  flex: 1;
  padding: 10px 0;
  border: none;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.inspiration-btn:active { opacity: 0.7; }
.inspiration-btn.primary {
  background: var(--surface-dark);
  color: var(--on-dark);
}
.inspiration-btn.secondary {
  background: var(--hairline-soft);
  color: var(--muted);
}

/* Toast */
#app-toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  background: rgba(29, 29, 31, 0.88);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  padding: 16px 24px;
  border-radius: var(--radius-card);
  text-align: center;
  white-space: pre-line;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
  z-index: 9999;
}
#app-toast.visible {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.section-header-row .section-title {
  margin-bottom: 0;
}

.header-actions {
  display: flex;
  gap: 8px;
}

/* Section Title */
.section-title {
  font-family: var(--font-heading);
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.7px;
}

/* Plan day label */
.plan-day-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 32px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 0;
}
.plan-day-label:first-child { margin-top: 0; }
.plan-day-label::before {
  display: none;
}

/* Plan List */
.plan-list { display: flex; flex-direction: column; gap: 0; }

.plan-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 0;
  background: transparent;
  border-radius: 0;
  cursor: pointer;
  transition: opacity 0.2s;
  margin-bottom: 0;
  border-bottom: 0.5px solid var(--hairline);
}
.plan-item:hover { opacity: 0.7; }

.plan-item.done {
  opacity: 0.5;
}
.plan-item.done .plan-title { text-decoration: line-through; color: var(--muted); }
.plan-item.done .plan-meta { color: var(--muted); }

.plan-checkbox {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1.5px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.plan-checkbox.checked {
  background: var(--success);
  border-color: var(--success);
}
.plan-checkbox.checked i { color: white; }
.plan-checkbox i { color: transparent; width: 14px; height: 14px; }

.plan-icon {
  width: 40px;
  height: 40px;
  border-radius: 0;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.plan-icon i { color: var(--primary); width: 22px; height: 22px; }
.plan-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-card); }

.plan-info { flex: 1; min-width: 0; }
.plan-title {
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 3px;
  letter-spacing: -0.3px;
}
.plan-meta {
  font-size: 13px;
  color: var(--muted);
}

.plan-arrow { flex-shrink: 0; }
.plan-arrow i { color: var(--muted); width: 16px; height: 16px; }

/* AI Suggestion */
.ai-suggestion {
  border: none;
  border-left: 2px solid var(--primary);
  border-radius: 0;
  padding: 20px 20px;
  margin-top: 48px;
  background: transparent;
}

.ai-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.ai-header i { color: var(--primary); width: 18px; height: 18px; }

  }
}

      }

    }

let currentWeatherType = 'any'; // 'sunny', 'rainy', 'any'

function getWeatherType() {
  // Determine from rendered weather
  const desc = document.querySelector('.weather-day .desc');
  if (desc) {
    const text = desc.textContent;
    if (text.includes('雨') || text.includes('雷')) return 'rainy';
    if (text.includes('晴') || text.includes('云')) return 'sunny';
  }
  return 'any';
}

function generateInspiration() {
  currentWeatherType = getWeatherType();
  
  // Get user's existing tags to personalize
  const userTags = markItems.map(i => i.tag);
  
  // Filter pool: match weather + avoid duplicates with existing marks
  const existingTitles = markItems.map(i => i.title.toLowerCase());
  let candidates = inspirationPool.filter(item => {
    if (existingTitles.includes(item.title.toLowerCase())) return false;
    if (item.weather === 'any') return true;
    if (item.weather === currentWeatherType) return true;
    if (currentWeatherType === 'any') return true;
    return false;
  });
  
  // Boost items matching user's preferred tags
  if (userTags.length > 0) {
    const tagCounts = {};
    userTags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
    candidates.sort((a, b) => {
      return (tagCounts[b.tag] || 0) - (tagCounts[a.tag] || 0) + Math.random() - 0.5;
    });
  } else {
    // Shuffle
    candidates.sort(() => Math.random() - 0.5);
  }
  
  if (candidates.length === 0) candidates = inspirationPool.sort(() => Math.random() - 0.5);
  
  // Pick one different from current
  let pick = candidates[0];
  if (currentInspiration && candidates.length > 1 && pick.title === currentInspiration.title) {
    pick = candidates[1];
  }
  
  currentInspiration = pick;
  renderInspiration(pick);
}

function showOnboarding() {
  // Create onboarding overlay
  const overlay = document.createElement('div');
  overlay.id = 'onboarding-overlay';
  overlay.innerHTML = `
    <div class="onboarding-card">
      <div class="onboarding-emoji">\u2600\uFE0F</div>
      <div class="onboarding-title">\u6B22\u8FCE\u4F7F\u7528\u7F8E\u597D\u5468\u672B</div>
      <div class="onboarding-subtitle">\u544A\u8BC9\u6211\u4F60\u7684\u6635\u79F0\u5427</div>
      <input type="text" id="onboarding-input" class="onboarding-input" placeholder="\u8F93\u5165\u6635\u79F0" autocomplete="off">
      <div class="onboarding-hint"><span id="onboarding-count">0</span>/10</div>
      <button class="onboarding-btn" id="onboarding-btn" disabled onclick="confirmNickname()">\u5F00\u59CB\u7F8E\u597D\u5468\u672B</button>
    </div>
  `;
  document.querySelector('.app-container').appendChild(overlay);
  const input = document.getElementById('onboarding-input');
  const btn = document.getElementById('onboarding-btn');
  let isComposing = false;
  input.addEventListener('compositionstart', function() {
    isComposing = true;
  });
  input.addEventListener('compositionend', function() {
    isComposing = false;
    // Truncate after composition completes
    if (input.value.length > 10) {
      input.value = input.value.slice(0, 10);
    }
    document.getElementById('onboarding-count').textContent = input.value.length;
    btn.disabled = input.value.trim().length === 0;
  });
  input.addEventListener('input', function() {
    if (isComposing) return; // Skip during IME composition
    if (input.value.length > 10) {
      input.value = input.value.slice(0, 10);
    }
    document.getElementById('onboarding-count').textContent = input.value.length;
    btn.disabled = input.value.trim().length === 0;
  });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !isComposing && input.value.trim()) confirmNickname();
  });
  // Request location permission first, then focus input
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      () => { input.focus(); },
      () => { input.focus(); },
      { timeout: 5000 }
    );
  } else {
    input.focus();
  }
}

function confirmNickname() {
  const input = document.getElementById('onboarding-input');
  const name = input.value.trim().slice(0, 10);
  if (!name) return;
  window._userNickname = name;
  saveToStorage();
  // Remove overlay with animation
  const overlay = document.getElementById('onboarding-overlay');
  overlay.style.opacity = '0';
  overlay.style.transition = 'opacity 0.3s';
  setTimeout(() => {
    overlay.remove();
    startApp();
  }, 300);
}

function setGreeting() {
  const h = new Date().getHours();
  let period = '早上';
  if (h >= 12 && h < 14) period = '中午';
  else if (h >= 14 && h < 18) period = '下午';
  else if (h >= 18) period = '晚上';
  const name = window._userNickname || '朋友';
  document.getElementById('greeting').textContent = `Hi ${name}，${period}好～`;
}

function setCountdown() {
  const now = new Date();
  const day = now.getDay();
  let daysUntil = 6 - day;
  if (day === 6 || day === 0) daysUntil = 0;
  if (daysUntil === 0) {
    document.getElementById('countdown').innerHTML = '🎉 今天就是周末！好好享受吧';
  } else {
    document.getElementById('countdown').innerHTML = `距离下个周末还有 <strong>${daysUntil}</strong> 天`;
  }
}

// Weather - Real data via Open-Meteo + Browser Geolocation
function loadWeather() {
  if (!navigator.geolocation) {
    console.log('Geolocation not supported');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      fetchWeather(lat, lon);
    },
    (err) => {
      console.log('Location denied, using default (Shenzhen)');
      // Fallback: Shenzhen
      fetchWeather(22.54, 114.06);
    },
    { timeout: 5000 }
  );
}

function fetchWeather(lat, lon) {
  // Get next Saturday and Sunday dates
  const now = new Date();
  const day = now.getDay();
  let satOffset = 6 - day;
  if (day === 6) satOffset = 0;
  if (day === 0) satOffset = 6;
  const sat = new Date(now);
  sat.setDate(now.getDate() + satOffset);
  const sun = new Date(sat);
  sun.setDate(sat.getDate() + 1);

  const formatDate = (d) => d.toISOString().split('T')[0];
  const startDate = formatDate(sat);
  const endDate = formatDate(sun);

  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&start_date=${startDate}&end_date=${endDate}&timezone=Asia%2FShanghai`;

  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (!data.daily) return;
      const temps = data.daily.temperature_2m_max;
      const codes = data.daily.weathercode;

      // Update Saturday
      const satTemp = Math.round(temps[0]);
      const satDesc = weatherCodeToText(codes[0]);
      const satIcon = weatherCodeToIcon(codes[0]);
      // Update Sunday
      const sunTemp = Math.round(temps[1]);
      const sunDesc = weatherCodeToText(codes[1]);
      const sunIcon = weatherCodeToIcon(codes[1]);

      const days = document.querySelectorAll('.weather-day');
      if (days[0]) {
        days[0].querySelector('.day-date').textContent = `${sat.getMonth()+1}月${sat.getDate()}日`;
        days[0].querySelector('.temp').textContent = satTemp + '°';
        days[0].querySelector('.desc').textContent = satDesc;
        days[0].querySelector('.weather-icon').innerHTML = `<i data-lucide="${satIcon}"></i>`;
      }
      if (days[1]) {
        days[1].querySelector('.day-date').textContent = `${sun.getMonth()+1}月${sun.getDate()}日`;
        days[1].querySelector('.temp').textContent = sunTemp + '°';
        days[1].querySelector('.desc').textContent = sunDesc;
        days[1].querySelector('.weather-icon').innerHTML = `<i data-lucide="${sunIcon}"></i>`;
      }
      lucide.createIcons();
    })
    .catch(e => console.log('Weather fetch failed:', e));
}

function weatherCodeToText(code) {
  const map = {
    0: '晴', 1: '晴', 2: '多云', 3: '阴',
    45: '雾', 48: '雾',
    51: '小雨', 53: '小雨', 55: '小雨',
    61: '中雨', 63: '中雨', 65: '大雨',
    71: '小雪', 73: '中雪', 75: '大雪',
    80: '阵雨', 81: '阵雨', 82: '暴雨',
    95: '雷阵雨', 96: '雷阵雨', 99: '雷阵雨'
  };
  return map[code] || '多云';
}

function weatherCodeToIcon(code) {
  if (code <= 1) return 'sun';
  if (code <= 3) return 'cloud-sun';
  if (code <= 48) return 'cloud-fog';
  if (code <= 55) return 'cloud-drizzle';
  if (code <= 65) return 'cloud-rain';
  if (code <= 75) return 'snowflake';
  if (code <= 82) return 'cloud-rain-wind';
  return 'cloud-lightning';
}

  const sunItems = planItems.filter(i => i.planDay === '周日');

    html += '<div class="plan-day-label">周六</div>';

      html += '<div class="plan-item ' + doneClass + '" data-id="' + item.id + '" onclick="openPlanDetail(' + item.id + ')">' +

      html += '<div class="plan-item ' + doneClass + '" data-id="' + item.id + '" onclick="openPlanDetail(' + item.id + ')">' +

function formatDetailMeta(item) {
  let dateStr = '';
  if (item.createdAt) {
    const d = new Date(item.createdAt);
    const now = new Date();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    if (d.getFullYear() !== now.getFullYear()) {
      dateStr = d.getFullYear() + '-' + mm + '-' + dd;
    } else {
      dateStr = mm + '-' + dd;
    }
  } else {
    dateStr = item.meta || '刚刚收藏';
  }
  if (item.inPlan && item.planDay) {
    return '已安排在本' + item.planDay + ' · 收藏于' + dateStr;
  } else {
    return '收藏于' + dateStr;
  }
}

function formatListMeta(item) {
  let dateStr = '';
  if (item.createdAt) {
    const d = new Date(item.createdAt);
    const now = new Date();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    if (d.getFullYear() !== now.getFullYear()) {
      dateStr = d.getFullYear() + '-' + mm + '-' + dd;
    } else {
      dateStr = mm + '-' + dd;
    }
    return '收藏于' + dateStr;
  }
  return item.meta || '刚刚收藏';
}

function submitAdd() {
  const name = document.getElementById('add-name').value.trim();
  const desc = document.getElementById('add-desc').value.trim();
  if (!name) return;

  if (editingItemId) {
    // Edit existing item
    const item = markItems.find(i => i.id === editingItemId);
    if (item) {
      item.title = name;
      item.desc = desc || '';
      item.tag = selectedFormTag || item.tag;
      item.icon = tagToIcon(item.tag);
      if (window._formImgData) item.img = window._formImgData;
      if (!window._formImgData && !item.img) item.img = null;
      if (selectedSchedule !== 'none') {
        item.inPlan = true;
        item.planDay = selectedSchedule;
      } else {
        item.inPlan = false;
        item.planDay = null;
      }
    }
    editingItemId = null;
  } else {
    // Create new item
    const newItem = {
      id: Date.now(),
      title: name,
      desc: desc || '',
      tag: selectedFormTag || '其他',
      icon: tagToIcon(selectedFormTag || '其他'),
      meta: '刚刚收藏',
      createdAt: Date.now(),
      img: window._formImgData || null,
      inPlan: selectedSchedule !== 'none',
      planDay: selectedSchedule !== 'none' ? selectedSchedule : null,
      done: false
    };
    markItems.push(newItem);
  }

  renderMarkList();
  renderPlanList();
  saveToStorage();
  hideModal('add-modal');
  document.getElementById('add-name').value = '';
  document.getElementById('add-desc').value = '';
  selectedFormTag = null;
  selectedSchedule = 'none';
}

// ====== RANDOM PICK with Dice Animation ======
let isRolling = false;
function randomPick() {
  const available = markItems.filter(i => !i.inPlan && !i.done);
  if (available.length === 0) {
    showToast('还没有可选的 Mark\n先去收藏几个吧 ✨');
    return;
  }
  if (isRolling) return;
  showDiceOverlay(available);
}

function showDiceOverlay(pool) {
  // Create overlay if not exists
  let overlay = document.getElementById('dice-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'dice-overlay';
    overlay.innerHTML = `
      <div class="dice-card">
        <div class="dice-close" onclick="closeDice()"><i data-lucide="x"></i></div>
        <div class="dice-icon-wrap" id="dice-icon-wrap" onclick="rerollDice()">
          <i data-lucide="dices"></i>
        </div>
        <div class="dice-result-title" id="dice-result-title">摇一摇...</div>
        <div class="dice-result-desc" id="dice-result-desc"></div>
        <div class="dice-result-tag" id="dice-result-tag"></div>
        <div class="dice-actions" id="dice-actions" style="display:none;">
          <button class="btn-full btn-primary" onclick="confirmDiceDay('周六')">周六做</button>
          <button class="btn-full" style="background:var(--surface-dark);color:var(--on-dark);" onclick="confirmDiceDay('周日')">周日做</button>
        </div>
      </div>
    `;
    document.querySelector('.app-container').appendChild(overlay);
  }
  overlay.style.display = 'flex';
  overlay.onclick = (e) => { if (e.target === overlay) closeDice(); };
  window._dicePool = pool;
  rollDice(pool);
}

function rollDice(pool) {
  isRolling = true;
  const iconWrap = document.getElementById('dice-icon-wrap');
  const titleEl = document.getElementById('dice-result-title');
  const descEl = document.getElementById('dice-result-desc');
  const tagEl = document.getElementById('dice-result-tag');

  // Hide actions during roll
  var actionsEl = document.getElementById('dice-actions');
  if (actionsEl) actionsEl.style.display = 'none';

  // Start rolling animation
  iconWrap.classList.add('rolling');
  titleEl.textContent = '摇一摇...';
  descEl.textContent = '';
  tagEl.textContent = '';

  // Simulate dice rolling with rapid text flicker
  let flickCount = 0;
  const flickInterval = setInterval(() => {
    const randItem = pool[Math.floor(Math.random() * pool.length)];
    titleEl.textContent = randItem.title;
    titleEl.style.opacity = '0.5';
    flickCount++;
    if (flickCount > 8) {
      clearInterval(flickInterval);
      // Final pick
      const finalPick = pool[Math.floor(Math.random() * pool.length)];
      window._dicePick = finalPick;
      setTimeout(() => {
        iconWrap.classList.remove('rolling');
        iconWrap.classList.add('landed');
        titleEl.textContent = finalPick.title;
        titleEl.style.opacity = '1';
        descEl.textContent = finalPick.desc || '';
        tagEl.textContent = finalPick.tag;
        isRolling = false;
        // Show action buttons
        var actionsEl = document.getElementById('dice-actions');
        if (actionsEl) actionsEl.style.display = 'flex';
        // Remove landed class after animation
        setTimeout(() => iconWrap.classList.remove('landed'), 500);
      }, 200);
    }
  }, 120);
  lucide.createIcons();
}

function rerollDice() {
  if (isRolling) return;
  rollDice(window._dicePool || markItems.filter(i => !i.inPlan && !i.done));
}

function confirmDiceDay(day) {
  if (!window._dicePick) return;
  window._dicePick.inPlan = true;
  window._dicePick.planDay = day;
  saveToStorage();
  renderPlanList();
  renderMarkList();
  closeDice();
}

function closeDice() {
  const overlay = document.getElementById('dice-overlay');
  if (overlay) overlay.style.display = 'none';
  isRolling = false;
}

  const emojiHtml = emojis.map(e => '<div class="rating-emoji" onclick="selectRating(this)">' + e + '</div>').join('');
  ratingSection.innerHTML = '<div class="rating-title">这个周末感觉怎么样？</div>' +
    '<div class="rating-options">' + emojiHtml + '</div>' +
    '<div class="note-area visible" id="note-area">' +
      '<textarea class="note-textarea" id="note-textarea" placeholder="记录一下这个周末..." maxlength="600"></textarea>' +
      '<div class="note-footer"><span class="note-count"><span id="char-count">0</span>/600</span>' +
      '<button class="btn-save" id="btn-save-note" onclick="saveNote()">保存</button></div>' +
    '</div>';
  if (data) {
    const allEmojis = document.querySelectorAll('.rating-emoji');
    allEmojis.forEach(el => { if (el.textContent === data.emoji) el.classList.add('selected'); });
    document.getElementById('note-textarea').value = data.text || '';
    document.getElementById('char-count').textContent = (data.text || '').length;
  }
  const ta = document.getElementById('note-textarea');
  ta.addEventListener('input', function() {
    document.getElementById('char-count').textContent = ta.value.length;
  });
}

function renderWeekNote() {
  const data = weekNotes[currentWeekLabel];
  if (data) {
    noteSaved = true;
    showStickyNote(data.emoji, data.text);
  } else {
    noteSaved = false;
    const ratingSection = document.querySelector('.rating-section');
    const emojis = ['😫','😐','🙂','😄','🤩'];
    const emojiHtml = emojis.map(e => '<div class="rating-emoji" data-score="' + (emojis.indexOf(e)+1) + '" onclick="selectRating(this)">' + e + '</div>').join('');
    ratingSection.innerHTML = '<div class="rating-title">这个周末感觉怎么样？</div>' +
      '<div class="rating-options">' + emojiHtml + '</div>' +
      '<div class="note-area" id="note-area">' +
        '<textarea class="note-textarea" id="note-textarea" placeholder="记录一下这个周末..." maxlength="600"></textarea>' +
        '<div class="note-footer"><span class="note-count"><span id="char-count">0</span>/600</span>' +
        '<button class="btn-save" id="btn-save-note" onclick="saveNote()">保存</button></div>' +
      '</div>';
  }
}

// Modal helpers
function showModal(id) {
  document.getElementById(id).classList.add('visible');
}

function hideModal(id) {
  document.getElementById(id).classList.remove('visible');
}

function closeModal(e, id) {
  if (e.target === document.getElementById(id)) {
    hideModal(id);
  }
}

// Start
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
